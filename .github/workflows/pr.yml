name: PR

# Everything a contributor's PR must pass, and nothing that costs money or
# needs a secret.
#
# A fork PR runs this in full: Tier A scenarios execute against `fake:` on
# ubuntu-latest with zero secrets. Issue filing and vendor-smoke are
# unreachable from a fork PR by construction — no `pull_request_target`, no
# secrets referenced here.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the full history, not just the tip: a key committed
          # and then "removed" in a later commit is still a published key.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Install the latest released kno via install.sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Resolved with an authenticated call, then handed to install.sh:
          # the anonymous /releases/latest endpoint is rate-limited per IP,
          # shared across every runner in the region, and a 403 there is an
          # infrastructure failure wearing a red X. Everything install.sh
          # actually guarantees — the download, the checksum, the signature —
          # still runs unchanged.
          tag=$(gh release view --repo uknoAI/kno --json tagName -q .tagName)
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://raw.githubusercontent.com/uknoAI/kno/main/install.sh \
            | KNO_VERSION="$tag" KNO_INSTALL_DIR="$HOME/.local/bin" sh 2>&1 | tee install.log
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          grep -q "Signature OK." install.log || {
            echo "::error::install.sh did not verify the cosign signature."
            exit 1
          }

      - name: Lint the recipes
        run: go run ./cmd/verify lint

      - name: Check every command shape against the released binary
        run: go run ./cmd/verify flags --kno "$(command -v kno)"

      - name: Run the Tier A scenarios, twice
        run: go run ./cmd/verify scenario --kno "$(command -v kno)" --repeat 2

      - name: Test the verifier itself
        run: |
          set -euo pipefail
          export KNO_BIN="$(command -v kno)"
          go vet ./...
          go test -race -shuffle=on ./...

      - name: gofmt
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt: $unformatted"
            exit 1
          fi

      - name: shellcheck the scenario scripts
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --shell=sh scenarios/*/run.sh .github/scripts/*.sh

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.28.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # History as well as tree: a key committed and then "removed" in a
          # later commit is still a published key.
          fetch-depth: 0

      # The pinned, checksum-verified binary rather than gitleaks-action.
      # Two reasons, and the first one is not a preference: gitleaks-action
      # refuses to run on an organization repository without a paid
      # GITLEAKS_LICENSE secret, which it reports as a red job — a security
      # gate whose failure mode is "unlicensed" is a gate that gets deleted.
      # The second is that this is exactly what uknoAI/kno's own secrets-scan
      # does, pinned to one version so both repositories run the same rule set.
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o "$asset" "$base/$asset"
          curl -sSfL -o "$sums"  "$base/$sums"
          grep " $asset\$" "$sums" | sha256sum -c -
          sudo tar -xzf "$asset" -C /usr/local/bin gitleaks
          gitleaks version

      # A scenario repository full of `export VENDOR_API_KEY=` lines is the
      # single most likely place in the organization for a real key to be
      # pasted. --redact so a finding does not reprint the secret into a public
      # CI log, which would publish it a second time.
      - name: Scan the working tree
        run: gitleaks detect --no-git --config .gitleaks.toml --redact -v

      - name: Scan the full history
        run: gitleaks detect --config .gitleaks.toml --redact -v
